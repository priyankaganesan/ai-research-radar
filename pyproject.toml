[project]
name = "ai-research-radar"
version = "0.1.0"
description = "A personal agent that tracks, summarizes and explains new AI research, running on a local model."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "feedparser>=6.0",
    "httpx>=0.27",
    "lancedb>=0.20",
    "langchain-core>=0.3",
    "langchain-ollama>=0.3",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langsmith>=0.3",
    "pydantic-settings>=2.4",
    "sqlite-vec>=0.1.6",
    "typer>=0.12",
]

[project.scripts]
radar = "radar.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option(...) in defaults is the intended Typer style

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
